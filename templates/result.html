<!DOCTYPE html>
<html>
<head>
<title>Result</title>

<style>

body{
font-family: Arial;
background:#f4f6f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:white;
padding:40px;
border-radius:10px;
text-align:center;
box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

.score{
font-size:30px;
color:#28a745;
}

button{
background:#007bff;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Your Score</h2>

<p class="score">{{score}} / {{total}}</p>

<a href="/"><button>Try Another Quiz</button></a>

</div>

</body>
</html>
