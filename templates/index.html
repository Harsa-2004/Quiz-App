<!DOCTYPE html>
<html>
<head>
<title>AI Quiz Generator</title>

<style>

body{
font-family: Arial;
background: linear-gradient(135deg,#6a11cb,#2575fc);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
background:white;
padding:30px;
border-radius:10px;
text-align:center;
color:black;
width:350px;
}

input{
width:80%;
padding:10px;
margin:10px;
}

button{
background:#2575fc;
color:white;
padding:10px 20px;
border:none;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#1b5ed7;
}

</style>

</head>

<body>

<div class="container">

<h2>AI Quiz Generator</h2>

<form method="POST">

<input type="text" name="topic" placeholder="Enter topic (Science, ML, etc)" required>

<br>

<button type="submit">Generate Quiz</button>

</form>

</div>

</body>
</html>
